# ===========================================================================
# Riva Speech NIMs — ASR + TTS for Finn voice pipeline
# ===========================================================================
# Architecture: Two NVIDIA NIM containers (ASR + TTS) with separate ports.
# Riva SDK is Jetson-only; x86 deployments use NIMs.
#
# Prerequisites:
#   1. NGC API key: https://org.ngc.nvidia.com/setup/api-keys
#   2. Docker login: echo $NGC_API_KEY | docker login nvcr.io -u '$oauthtoken' --password-stdin
#   3. Set NGC_API_KEY env var or add to .env file
#
# Usage:
#   # Start both ASR + TTS (first run downloads models, ~10-30 min):
#   docker compose -f docker/docker-compose.riva.yml up -d
#
#   # Start ASR only:
#   docker compose -f docker/docker-compose.riva.yml up -d riva-asr
#
#   # Check health:
#   curl http://localhost:9010/v1/health/ready   # ASR
#   curl http://localhost:9020/v1/health/ready   # TTS
#
# Speech Router integration:
#   RIVA_ASR_URL=http://localhost:9010
#   RIVA_TTS_URL=http://localhost:9020
#   RIVA_ASR_GRPC=localhost:50051
#   RIVA_TTS_GRPC=localhost:50052
# ===========================================================================

services:
  # ── ASR — Parakeet CTC 1.1B (en-US) ──────────────────────────────────────
  riva-asr:
    image: nvcr.io/nim/nvidia/parakeet-1-1b-ctc-en-us:latest
    container_name: riva-asr
    restart: unless-stopped
    ports:
      - "9010:9010"    # HTTP API
      - "50051:50051"  # gRPC
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9010
      - NIM_GRPC_API_PORT=50051
      - NIM_TAGS_SELECTOR=name=parakeet-1-1b-ctc-en-us,mode=offline
    volumes:
      - nim-cache:/opt/nim/.cache
    shm_size: 8gb
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9010/v1/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s  # model download + TRT build can take minutes

  # ── TTS — Magpie Multilingual ─────────────────────────────────────────────
  riva-tts:
    image: nvcr.io/nim/nvidia/magpie-tts-multilingual:latest
    container_name: riva-tts
    restart: unless-stopped
    ports:
      - "9020:9020"    # HTTP API
      - "50052:50052"  # gRPC
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_HTTP_API_PORT=9020
      - NIM_GRPC_API_PORT=50052
      - NIM_TAGS_SELECTOR=name=magpie-tts-multilingual
    volumes:
      - nim-cache:/opt/nim/.cache
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9020/v1/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  nim-cache:
    name: nim-cache
