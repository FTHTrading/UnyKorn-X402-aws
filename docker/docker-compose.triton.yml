  #   restart: unless-stopped
  #   ports:
  #     - "8010:8000"
  #     - "8011:8001"
  #     - "8012:8002"
  #   volumes:
  #     - trtllm-engines:/engines
  #     - triton-models-llm:/models
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #     - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   command: >
  #     tritonserver
  #       --model-repository=/models
  #       --strict-model-config=false
  #       --log-verbose=0
  #   healthcheck:
  #     test: ["CMD", "curl", "-sf", "http://localhost:8000/v2/health/ready"]
  #     interval: 15s
