# ===========================================================================
# FTH x402 Stack — Docker Compose (local development)
# ===========================================================================
# Usage:  docker compose -f docker-compose.x402.yml up -d
# Tear:   docker compose -f docker-compose.x402.yml down

version: "3.9"

services:
  # --- PostgreSQL (use existing unykorn-postgres or spin up dedicated) ---
  x402-db:
    image: postgres:16-alpine
    container_name: fth-x402-postgres
    environment:
      POSTGRES_USER: unykorn
      POSTGRES_PASSWORD: unykorn_dev
      POSTGRES_DB: fth_x402
    ports:
      - "5442:5432"  # Use 5442 to avoid conflict with existing pg containers
    volumes:
      - x402_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unykorn -d fth_x402"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- DB Migrations (runs once then exits) ---
  x402-migrate:
    image: node:20-alpine
    container_name: fth-x402-migrate
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      DATABASE_URL: postgresql://unykorn:unykorn_dev@x402-db:5432/fth_x402
      PGHOST: x402-db
      PGPORT: "5432"
      PGUSER: unykorn
      PGPASSWORD: unykorn_dev
      PGDATABASE: fth_x402
    depends_on:
      x402-db:
        condition: service_healthy
    command: >
      sh -c "node scripts/x402-db-setup.mjs && node scripts/x402-seed-namespaces.mjs"
    restart: "no"

  # --- Facilitator ---
  x402-facilitator:
    build:
      context: .
      dockerfile: packages/fth-x402-facilitator/Dockerfile
    container_name: fth-x402-facilitator
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://unykorn:unykorn_dev@x402-db:5432/fth_x402
      PGHOST: x402-db
      PGPORT: "5432"
      PGUSER: unykorn
      PGPASSWORD: unykorn_dev
      PGDATABASE: fth_x402
      FTH_SIGNING_KEY: ${FTH_SIGNING_KEY:-YaUCZ6eiYv7ILVeeNgwM6haGGyZDof9KZVfxqROCTmw8jeKvtPDNUhz25zPLR1TBYioVHdCSbdGDan5tCwp0kA==}
      L1_RPC_URL: ${L1_RPC_URL:-https://rpc.l1.unykorn.org}
      L1_CHAIN_ID: "7331"
    depends_on:
      x402-db:
        condition: service_healthy
      x402-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Rust Signer (key custody & signing) ---
  x402-signer:
    build:
      context: services/rust-signer
      dockerfile: Dockerfile
    container_name: fth-x402-signer
    ports:
      - "4050:4050"
    environment:
      SIGNER_HOST: "0.0.0.0"
      SIGNER_PORT: "4050"
      SIGNER_DB_PATH: /app/data/signer.db
    volumes:
      - x402_signer_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4050/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- UNY Ledger ---
  x402-ledger:
    image: node:20-alpine
    container_name: fth-x402-ledger
    working_dir: /app
    volumes:
      - .:/app:ro
    ports:
      - "4030:4030"
    environment:
      NODE_ENV: production
      PORT: "4030"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://unykorn:unykorn_dev@x402-db:5432/fth_x402
      SIGNER_URL: http://x402-signer:4050
    depends_on:
      x402-db:
        condition: service_healthy
      x402-migrate:
        condition: service_completed_successfully
    command: ["node", "apps/uny-ledger/dist/index.js"]
    restart: unless-stopped

  # --- Agent Gateway ---
  x402-gateway:
    image: node:20-alpine
    container_name: fth-x402-gateway
    working_dir: /app
    volumes:
      - .:/app:ro
    ports:
      - "4010:4010"
    environment:
      NODE_ENV: production
      PORT: "4010"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://unykorn:unykorn_dev@x402-db:5432/fth_x402
      SIGNER_URL: http://x402-signer:4050
      LEDGER_URL: http://x402-ledger:4030
    depends_on:
      x402-db:
        condition: service_healthy
      x402-signer:
        condition: service_healthy
      x402-migrate:
        condition: service_completed_successfully
    command: ["node", "apps/agent-gateway/dist/index.js"]
    restart: unless-stopped

volumes:
  x402_pgdata:
  x402_signer_data:
